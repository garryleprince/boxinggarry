<!doctype html>
<html lang="fr" data-theme="sombre">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the app paint under the notch and home indicator;
      the layout reclaims the space with env(safe-area-inset-*).
      user-scalable is left enabled: pinch-zoom is an accessibility feature.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#08090b" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Coach de préparation physique au poids du corps pour la boxe. 20 minutes par jour." />

    <!-- Home-screen install on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Boxing Coach" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

    <title>Boxing Body Coach</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Boxing Body Coach a besoin de JavaScript pour fonctionner.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
